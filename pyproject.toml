[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tactiq"
version = "1.0.0"
description = "Tactical DNA matchup prediction engine for FIFA World Cup 2026"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.4.6",
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.50",
    "python-dotenv==1.0.1",
    "statsbombpy==1.19.0",
    "requests==2.34.2",
    "beautifulsoup4==4.14.3",
    "lxml==6.0.2",
    "scikit-learn==1.8.0",
    "umap-learn==0.5.12",
    "xgboost==3.2.0",
    "shap==0.51.0",
    "streamlit==1.58.0",
    "plotly==6.6.0",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "optuna==4.8.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff>=0.4",
    "jupyter==1.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
